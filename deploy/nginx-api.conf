# Deploy Phase 3.5 — nginx snippet for the VPS (ferramox.duckdns.org).
#
# The domain is ALREADY owned by sites-enabled/frontend (the wedding site, whose
# Express app owns the whole /api/* namespace). So this block must be INSERTED
# inside that existing `server { ... }`, BEFORE its `location /api/`, and nothing
# else in that file may change.
#
# nginx picks the longest prefix match, so /ranking-api/ wins over /api/ and the
# wedding app keeps serving every other path (including its own /api/*).

# The frontend appends /api/... to the base, so the browser really requests:
#   GET  /ranking-api/api/ranking?game=all&limit=10
#   POST /ranking-api/api/score      POST /ranking-api/api/login
# proxy_pass with a bare "/" strips ONLY the /ranking-api/ prefix, so those become
#   GET  http://127.0.0.1:8765/api/ranking?...   POST .../api/score   .../api/login
# (Do NOT write proxy_pass .../api/ here — that would produce /api/api/score.)

    location /ranking-api/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # tooFast(ip) needs the real client IP
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

# Verify after `nginx -t` + `systemctl restart nginx`:
#   curl https://ferramox.duckdns.org/ranking-api/api/health   -> {"ok":true,...}
#   curl -X POST https://ferramox.duckdns.org/ranking-api/api/score -H 'Content-Type: application/json' --data "@body.json"
#   curl http://ferramox.duckdns.org/                          -> wedding page must still be 200 (regression)
