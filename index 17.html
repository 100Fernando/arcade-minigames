<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="card">
        <div class="card-header"><button class="minimize-btn" id="minimizeBtn" type="button" title="Minimizar">−</button></div>
        <div class="icon">👋</div>
        <h1 class="greeting">Olá, Mundo!</h1>
        <div class="divider"></div>
        <p class="subtitle">Bem-vindo ao futuro</p>
        <div class="game-section minimized" id="targetGameSection">
            <div class="game-header"><div class="game-icon" id="targetGameIcon">🎯</div><h2 class="game-title">🎯 Jogo de Alvos</h2></div>
            <div class="game-stats"><span>Score: <span class="score" id="score">0</span></span><span>Recorde: <span class="highscore" id="highscore">0</span></span></div>
            <div class="game-board" id="gameBoard" style="height: 600px; background: #1a1a2e; border-radius: 10px; overflow: hidden;">
                <div id="targetGameCanvasContainer"></div><canvas id="targetCanvas" width="500" height="600" style="display: block;"></canvas>
            </div>
            <button class="restart-btn" id="restartBtn" type="button">Reiniciar Jogo</button>
        </div>
        <div class="game-section minimized" id="siGameSection">
            <div class="game-header"><div class="game-icon" id="spaceInvadersIcon" title="Clique para abrir o jogo">👾</div><h2 class="game-title">👾 Space Invaders</h2></div>
            <div class="si-game-container" id="siGameContainer">
                <div class="si-game-canvas-wrapper">
                    <canvas id="siCanvas" width="500" height="600"></canvas>
                    <div class="overlay" id="siOverlay">
                        <div class="overlay-content">
                            <h2 id="siTitle">Space Invaders</h2>
                            <div class="overlay-controls">
                                <button class="btn-primary" id="siStartBtn" type="button">Start</button>
                                <button class="btn-secondary" id="siRestartBtn" type="button">Restart</button>
                            </div>
                            <div class="overlay-hint">← → Move | SPACE Fire | R Restart</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="audio.js"></script>
</body>
</html>
