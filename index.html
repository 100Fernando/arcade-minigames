<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="particles" id="particles"></div>
    <div class="card">
        <div class="icon">👋</div>
        <h1 class="greeting">Olá, Mundo!</h1>
        <div class="divider"></div>
        <p class="subtitle">Bem-vindo ao futuro</p>
        <div class="game-icon" id="gameIcon">🎯</div>
        <button class="minimize-btn" id="minimizeBtn">−</button>
        <div class="game-section" id="gameSection">
            <h2 class="game-title">🎯 Jogo de Alvos</h2>
            <div class="game-stats">
                <span>Score: <span class="score" id="score">0</span></span>
                <span>Recorde: <span class="highscore" id="highscore">0</span></span>
            </div>
            <div class="game-board" id="gameBoard"></div>
            <button class="restart-btn" id="restartBtn">Reiniciar Jogo</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
